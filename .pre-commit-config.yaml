# Optional local hooks (`pre-commit install`). The project tools run through
# `uv run`, so they use exactly the versions and configuration from
# pyproject.toml / uv.lock that CI uses (scripts/check.sh --check).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, markdown]
      - id: codespell
        name: codespell
        entry: uv run codespell
        language: system
        types: [text]
      - id: yamllint
        name: yamllint
        entry: uv run yamllint --strict
        language: system
        types: [yaml]
      - id: actionlint
        name: actionlint
        entry: uv run actionlint
        language: system
        files: ^\.github/workflows/
      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml -r custom_components/webasto_next_modbus
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy custom_components/webasto_next_modbus
        language: system
        pass_filenames: false
        types: [python]
