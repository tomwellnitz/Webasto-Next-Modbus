[project]
name = "webasto-next-modbus"
version = "1.4.0"
description = "Home Assistant integration for Webasto Next / Ampure Unite wallboxes via Modbus TCP and REST API"
authors = [{ name = "Webasto Next maintainers" }]
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    # The Modbus connection comes from Home Assistant core's `modbus`
    # integration (manifest `dependencies: ["modbus"]`), which installs
    # modbus-connection with its tmodbus backend; manifest.json therefore has
    # no requirements. Listed here because the integration imports it.
    "modbus-connection>=4.10.0",
    "aiohttp>=3.13.5",
]

[project.scripts]
virtual-wallbox = "virtual_wallbox.cli:main"
webasto-smoke = "virtual_wallbox.smoke:main"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.coverage.run]
source = ["custom_components/webasto_next_modbus"]
branch = true

[tool.coverage.report]
# CI fails below this line/branch coverage; raise it as coverage improves.
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
exclude = [".vulture_whitelist.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "C4", "TID", "BLE", "RUF", "SIM", "PT"]

[tool.bandit]
skips = ["B101", "B110"]

[tool.vulture]
min_confidence = 80
paths = ["custom_components", "virtual_wallbox", "scripts"]
sort_by_size = true
verbose = false
exclude = [".venv", ".git", "__pycache__"]
ignore_names = ["_attr_has_entity_name"]

[tool.uv]
# Install the project with a plain .pth path entry instead of setuptools'
# import-hook finder: Home Assistant's loader iterates
# `custom_components.__path__` as directories and crashes on the finder's
# `__editable__...__path_hook__` entry, which breaks every test that sets up
# the integration in a real hass instance.
config-settings = { editable_mode = "compat" }

[tool.setuptools]
packages = [
  "custom_components.webasto_next_modbus",
  "virtual_wallbox",
]

[tool.setuptools.package-data]
"custom_components.webasto_next_modbus" = ["py.typed"]

[tool.mypy]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# voluptuous ships no type information; treat it as untyped rather than
# erroring on the missing stubs.
module = ["voluptuous", "voluptuous.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12",
    "bandit>=1.9.2",
    "codespell>=2.4.1",
    "colorlog>=6.10.1",
    "coverage>=7.10.6",
    "deptry>=0.24.0",
    "homeassistant>=2026.9.0",
    "mdformat>=0.7.19",
    # Pinned to what Home Assistant's `modbus` integration requires in the HA
    # version pytest-homeassistant-custom-component pins (HA 2026.9.4), so
    # the tests run the same connection code as production. Bump together
    # with phcc. pytest-homeassistant-custom-component does not install
    # integration requirements, hence the explicit entries.
    "modbus-connection[tmodbus]==4.10.0",
    "mypy>=1.8",
    "pycares<6.0.0",
    # Only for the virtual_wallbox TCP simulator (virtual_wallbox/server.py),
    # which still targets the pymodbus 3.11 datastore API; the integration
    # itself no longer uses pymodbus.
    "pymodbus>=3.11.2,<3.12",
    "pytest>=9.0.0",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov==7.1.0",
    "pytest-homeassistant-custom-component==0.13.367",
    "ruff>=0.5",
    "tmodbus==0.6.2",  # see modbus-connection above
    "voluptuous>=0.15.2",
    "vulture>=2.14",
    "yamllint>=1.37.1",
]

[tool.deptry]
extend_exclude = ["scripts"]

[tool.deptry.per_rule_ignores]
DEP003 = ["custom_components"]
# virtual_wallbox (a dev tool shipped in the same package) uses pymodbus for
# its TCP simulator.
DEP004 = ["homeassistant", "voluptuous", "pymodbus"]

# Single codespell configuration, used by CI, scripts/check.sh and pre-commit.
[tool.codespell]
skip = "./.*,*.pdf,*.log,*.log.*,*.csv,*.json,*.ambr,uv.lock,*.egg-info,./build,./dist"
ignore-words-list = "hass,alle,unter,adresse,ist,oder,paket,intervall,stopp,startet,aktive,variante,randomised"
quiet-level = 2

