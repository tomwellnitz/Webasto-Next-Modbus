version: 2
updates:
  # The uv ecosystem updates pyproject.toml and uv.lock together, so CI's
  # `uv sync --locked` keeps passing on Dependabot PRs.
  - package-ecosystem: uv
    directory: "/"
    # Weekly, so a Home Assistant patch release (a patch bump of
    # pytest-homeassistant-custom-component, see below) reaches the test
    # environment within days: HA pins most transitive packages exactly, so
    # its releases are the only way their security fixes get into uv.lock.
    schedule:
      interval: weekly
    # Wait a few days after a release before opening a PR. Avoids churn from
    # same-week double-bumps (e.g. a release that gets a hotfix the next day)
    # and gives upstream time to yank a bad version. Patch releases (every HA
    # patch release included) only wait 2 days. Security updates ignore the
    # cooldown and still arrive immediately.
    cooldown:
      default-days: 7
      semver-patch-days: 2
    # Only direct dependencies declared in pyproject.toml; transitive bumps
    # in uv.lock would just be noise.
    allow:
      - dependency-type: "direct"
    # pytest-homeassistant-custom-component is deliberately NOT ignored:
    # it pins the Home Assistant version the tests run against, and every
    # HA release (including 2026.10.0 itself) is only a *patch* bump of it
    # (0.13.367 = HA 2026.9.4, 0.13.368 = HA 2026.10.0b0). Ignoring patch
    # bumps meant the test environment never followed HA. It gets a group of
    # its own, so an HA release is never held back by another dependency.
    ignore:
      # pymodbus is only a dev dependency for the virtual_wallbox TCP
      # simulator, which needs the 3.11 datastore API; see AGENTS.md
      # § Dependency Pinning.
      - dependency-name: "pymodbus"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      home-assistant-test-env:
        patterns:
          - "pytest-homeassistant-custom-component"
      python-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "pytest-homeassistant-custom-component"
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
