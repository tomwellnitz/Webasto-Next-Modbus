name: Upstream compatibility

# Early-warning canary against the moving targets HA-Core ships. Runs
# weekly (and on demand):
#
#   * ha-latest: installs the latest Home Assistant plus the requirements
#     of its `modbus` integration (which provides our Modbus connection),
#     checks the shared-connection API we use is still there, and
#     smoke-imports the production modules — catches runtime API drift.
#
#   * hassfest: static schema validation against HA-Core main — catches
#     integration-manifest / schema drift.
#
# A failure in either job means an upcoming HA release will break the
# integration for end users — same failure mode as #88, but caught
# ~1-2 weeks early so we can hot-fix or widen constraints before HACS
# users hit it.

on:
  schedule:
    - cron: '17 6 * * 1'   # Monday, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ha-latest:
    name: Latest Home Assistant + pymodbus
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        # Deliberately no cache-dependency-glob: this job must not restore
        # the project's uv.lock but resolve the actual latest upstream
        # versions in a fresh environment.

      - name: Create fresh venv and install latest HA + its modbus requirements
        # Venv lives outside the workspace so hassfest (in the sibling
        # job) never has a chance to walk site-packages. Kept off
        # $HOME too so nothing accidentally leaks into the runner's
        # default python. Home Assistant installs an integration's
        # requirements at runtime; read them from the `modbus` manifest so
        # the canary gets exactly what HA would install.
        run: |
          uv venv --python 3.14.2 "${RUNNER_TEMP}/venv-canary"
          # shellcheck disable=SC1091
          source "${RUNNER_TEMP}/venv-canary/bin/activate"
          uv pip install --upgrade homeassistant voluptuous colorlog packaging
          mapfile -t modbus_requirements < <(python - <<'PY'
          import json
          from importlib.resources import files

          manifest = files("homeassistant.components.modbus") / "manifest.json"
          print("\n".join(json.loads(manifest.read_text())["requirements"]))
          PY
          )
          uv pip install "${modbus_requirements[@]}"

      - name: Show installed versions
        # `uv venv` intentionally creates a venv without pip (uv itself is
        # the package manager). Read the installed version from the
        # metadata instead of shelling out to `python -m pip show`.
        run: |
          # shellcheck disable=SC1091
          source "${RUNNER_TEMP}/venv-canary/bin/activate"
          python - <<'PY'
          from importlib.metadata import version
          for package in ("homeassistant", "modbus-connection", "tmodbus"):
              print(f"{package:18}: {version(package)}")
          PY

      - name: Verify the shared Modbus connection API
        # The integration gets its connection from Home Assistant's modbus
        # integration. Fail early if the helpers or their signatures change.
        run: |
          # shellcheck disable=SC1091
          source "${RUNNER_TEMP}/venv-canary/bin/activate"
          python - <<'PY'
          import inspect
          import sys

          import homeassistant  # noqa: F401  (bootstraps probatio first)
          from homeassistant.components import modbus
          from modbus_connection import ModbusTcpParams, ModbusUnit

          expected = {
              "async_get_unit": ["hass", "entry", "params", "unit_id"],
              "async_get_temporary_unit": ["hass", "params", "unit_id"],
          }
          failed = False
          for name, params in expected.items():
              helper = getattr(modbus, name, None)
              if helper is None:
                  print(f"❌ homeassistant.components.modbus.{name} is gone")
                  failed = True
                  continue
              actual = list(inspect.signature(helper).parameters)
              if actual[: len(params)] != params:
                  print(f"❌ {name}{inspect.signature(helper)} changed (expected {params})")
                  failed = True
              else:
                  print(f"✓ {name}{inspect.signature(helper)}")

          for method in ("read_holding_registers", "read_input_registers", "write_register", "disconnect"):
              if not hasattr(ModbusUnit, method):
                  print(f"❌ ModbusUnit.{method} is gone")
                  failed = True
          ModbusTcpParams(host="192.0.2.1", port=502)
          sys.exit(1 if failed else 0)
          PY

      - name: Smoke-import production modules
        # Import `homeassistant` first, the way a real HA install does: HA is
        # bootstrapped (and runs install_as_voluptuous(), which swaps in
        # probatio) long before any custom integration is imported. Importing
        # our package first would pull in the real `voluptuous` and make HA warn
        # that it is shadowing an already-imported module — an artefact of the
        # canary's import order, not of the integration.
        run: |
          # shellcheck disable=SC1091
          source "${RUNNER_TEMP}/venv-canary/bin/activate"
          python - <<'PY'
          import importlib
          import pkgutil

          import homeassistant  # noqa: F401  (must come first, see above)
          import custom_components.webasto_next_modbus as integration

          for module in pkgutil.iter_modules(integration.__path__):
              importlib.import_module(f"{integration.__name__}.{module.name}")
              print(f"✓ imported {module.name}")
          PY

  hassfest:
    # Split from ha-latest so hassfest sees a clean workspace: the
    # earlier design ran hassfest in the same job as the venv install,
    # and hassfest then walked into `<venv>/lib/pythonX.Y/site-packages/
    # homeassistant/components/*` and treated every built-in integration
    # as a custom one. Mirrors ci.yaml's `validate` job (fresh checkout,
    # no venv).
    name: Hassfest against latest HA-Core schema
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hassfest
        # Deliberate exception to the SHA-pinning pattern used for every
        # other Action in .github/workflows: the whole purpose of this
        # canary is to catch upcoming HA-Core breakage, so hassfest MUST
        # float with HA-Core's main branch — pinning it to a SHA would
        # freeze it to a specific HA-Core snapshot and defeat the design.
        # ci.yaml uses @master here for the same reason.
        uses: home-assistant/actions/hassfest@master
