name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# A new push to a PR supersedes the run for the previous commit; runs on main
# are never cancelled so every merged commit gets a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The required status checks on `main` are named after these jobs:
  # `build (<python-version>)`, `validate` and CodeQL's `Analyze (<language>)`.
  # Renaming a job or changing the matrix values renames the check, so update
  # the branch protection rule in the same change (see AGENTS.md).
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.2"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --locked fails if uv.lock is out of date with pyproject.toml instead of
      # silently re-resolving, so CI always tests exactly the committed lock.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run checks
        run: ./scripts/check.sh --check

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
