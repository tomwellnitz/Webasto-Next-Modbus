name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.14.2

      # The tag, manifest.json and pyproject.toml must agree: HACS shows the
      # tag, Home Assistant the manifest version. A final release also needs
      # its own CHANGELOG section (pre-releases use "Unreleased").
      - name: Verify version and changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import tomllib

          tag = os.environ["TAG_NAME"]
          version = tag.removeprefix("v")
          base_version = version.split("-", 1)[0]

          with open("custom_components/webasto_next_modbus/manifest.json") as f:
              manifest_version = json.load(f)["version"]
          with open("pyproject.toml", "rb") as f:
              project_version = tomllib.load(f)["project"]["version"]
          with open("CHANGELOG.md") as f:
              changelog = f.read()

          errors = []
          if manifest_version != base_version:
              errors.append(f"manifest.json version {manifest_version} != tag {tag}")
          if project_version != base_version:
              errors.append(f"pyproject.toml version {project_version} != tag {tag}")
          if version == base_version and not re.search(
              rf"^## \[{re.escape(version)}\]", changelog, re.MULTILINE
          ):
              errors.append(f"CHANGELOG.md has no '## [{version}]' section")

          for error in errors:
              print(f"::error::{error}")
          sys.exit(1 if errors else 0)
          PY

      - name: Install dependencies
        run: uv sync --locked

      - name: Run checks
        run: ./scripts/check.sh --check

      # Asset for manual installs: unzip into the Home Assistant config
      # directory. HACS installs from the tagged source, not from this zip.
      - name: Zip custom component
        run: |
          zip -r webasto_next_modbus.zip custom_components/webasto_next_modbus blueprints \
            -x "*.DS_Store" -x "*__pycache__*"

      - name: Extract release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Remove the 'v' prefix to match the changelog version (e.g. 1.2.0-beta.1)
          VERSION=${TAG_NAME#v}

          # Pre-release tags (anything with a '-', e.g. -beta.1) don't get their
          # own changelog section, so pull the "Unreleased" section instead.
          SECTION="$VERSION"
          case "$TAG_NAME" in
            *-*) SECTION="Unreleased" ;;
          esac

          # Print from the section header up to (excluding) the next one.
          awk -v header="## [$SECTION]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          # Fallback for an empty section (e.g. a pre-release without notes)
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release $TAG_NAME" > RELEASE_NOTES.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: webasto_next_modbus.zip
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
