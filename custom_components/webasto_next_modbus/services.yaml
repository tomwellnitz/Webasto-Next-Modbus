set_current:
  fields:
    config_entry_id:
      example: "d4f4e2e7c3d6499f9bc2f6b4f4bb86a7"
      selector:
        config_entry:
          integration: webasto_next_modbus
    amps:
      required: true
      example: 16
      selector:
        number:
          min: 0
          max: 32
          step: 1
          unit_of_measurement: A

set_failsafe:
  fields:
    config_entry_id:
      example: "d4f4e2e7c3d6499f9bc2f6b4f4bb86a7"
      selector:
        config_entry:
          integration: webasto_next_modbus
    amps:
      required: true
      example: 10
      selector:
        number:
          min: 6
          max: 32
          step: 1
          unit_of_measurement: A
    timeout_s:
      required: false
      example: 30
      selector:
        number:
          min: 6
          max: 120
          step: 1
          unit_of_measurement: s

send_keepalive:
  fields:
