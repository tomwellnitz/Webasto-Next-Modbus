---
blueprint:
  name: Webasto Next / Unite – Solar Surplus Optimizer
  description: >-
    Adjusts the charging current based on grid export/import to maximize solar
    self-consumption. Requires a grid power sensor (negative = export, positive
    = import).


    The charging current is set per phase, and 6 A per phase is the lowest
    current a car charges with (IEC 61851). With a phase sensor the conversion
    from watts to amps follows the active phase mode. On a Webasto / Ampure
    Unite the blueprint can also switch between single- and three-phase
    charging, so charging can start from ~1.4 kW instead of ~4.1 kW of surplus.
  domain: automation
  input:
    current_entity:
      name: Charging Current Entity
      description: >-
        The entity controlling the wallbox current
        (e.g., number.webasto_..._charge_current_limit).
      selector:
        entity:
          domain: number
          device_class: current
    grid_sensor:
      name: Grid Power Sensor (Watts)
      description: >-
        Sensor measuring grid power in watts. Negative value must mean export
        (surplus).
      selector:
        entity:
          domain: sensor
          device_class: power
    min_current:
      name: Minimum Current (A)
      description: Minimum charging current per phase (usually 6A).
      default: 6
      selector:
        number:
          min: 6
          max: 32
          unit_of_measurement: A
    max_current:
      name: Maximum Current (A)
      description: Maximum charging current per phase allowed.
      default: 16
      selector:
        number:
          min: 6
          max: 32
          unit_of_measurement: A
    below_minimum:
      name: Below the minimum current
      description: >-
        What to do when the surplus is too small even for the minimum current.
        "Keep charging" charges at the minimum (some grid import), "Pause"
        sets the current to 0 A and resumes once the surplus is large enough.
      default: keep
      selector:
        select:
          options:
            - label: Keep charging at the minimum current
              value: keep
            - label: Pause charging (0 A)
              value: pause
    watts_per_amp:
      name: Watts per Ampere (without a phase sensor)
      description: >-
        Conversion factor used when no phase sensor is selected. For 3-phase
        charging at 230V: ~690 W/A. For 1-phase: ~230 W/A.
      default: 690
      selector:
        number:
          min: 200
          max: 22000
          unit_of_measurement: W/A
    phase_sensor:
      name: Phase mode sensor (optional)
      description: >-
        The wallbox's "Number of phases" sensor (Webasto / Ampure Unite). With
        it, watts per ampere follow the active phase mode (1 × or 3 × the
        voltage below) instead of the fixed factor above.
      default: ""
      selector:
        entity:
          domain: sensor
          integration: webasto_next_modbus
    voltage:
      name: Phase voltage (V)
      description: Voltage per phase, used together with the phase sensor.
      default: 230
      selector:
        number:
          min: 100
          max: 260
          unit_of_measurement: V
    phase_switch:
      name: Phase switch (optional)
      description: >-
        The wallbox's "Three-phase charging" switch (Webasto / Ampure Unite).
        Requires the phase sensor. Switches to single-phase when the surplus
        can't carry the minimum current on three phases, and back to
        three-phase when it can. Some cars briefly interrupt charging while
        the phases change.
      default: ""
      selector:
        entity:
          domain: switch
          integration: webasto_next_modbus
    phase_switch_interval:
      name: Minimum time between phase changes (minutes)
      description: >-
        Phase changes are hard on the contactors and the car, so the
        blueprint waits at least this long after a change before the next.
      default: 10
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: min

mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input grid_sensor

variables:
  grid_sensor: !input grid_sensor
  current_entity: !input current_entity
  min_amp: !input min_current
  max_amp: !input max_current
  below_minimum: !input below_minimum
  fixed_w_per_amp: !input watts_per_amp
  phase_sensor: !input phase_sensor
  volts: !input voltage
  phase_switch: !input phase_switch
  phase_switch_minutes: !input phase_switch_interval

  # Get current values
  grid_power: "{{ states(grid_sensor) | float(0) }}"
  current_setpoint: "{{ states(current_entity) | float(min_amp) }}"

  # Active phase count from the phase sensor; without one the fixed
  # conversion factor is used instead.
  phases: "{{ 1 if states(phase_sensor) == 'single_phase' else 3 }}"
  w_per_amp: "{{ volts * phases if phase_sensor else fixed_w_per_amp }}"

  # Calculate surplus (Export is negative, so Surplus = -Grid)
  # If Grid is -2000W (Export), Surplus is 2000W.
  surplus: "{{ -1 * grid_power }}"

  # Calculate available power for charging
  # Available = Current_Charging_Power + Surplus
  # Current_Charging_Power = Setpoint * W_per_Amp
  current_load_watts: "{{ current_setpoint * w_per_amp }}"
  available_watts: "{{ current_load_watts + surplus }}"

  # Calculate new target amps, rounded down to be safe (avoid importing)
  target_amps: "{{ (available_watts / w_per_amp) | int }}"

  # Phase switching (needs both the switch and the phase sensor).
  can_switch_phases: >-
    {{ phase_switch != '' and phase_sensor != ''
       and states(phase_switch) in ['on', 'off']
       and (now() - states[phase_switch].last_changed).total_seconds()
           >= phase_switch_minutes * 60 }}
  # Three phases need min_amp on each phase; switch down when the surplus
  # can't carry that, and back up only once it can (with 10 % headroom, so
  # a fluctuating surplus doesn't flip the phases back and forth).
  switch_to_single: >-
    {{ can_switch_phases and phases == 3
       and available_watts < min_amp * volts * 3
       and available_watts >= min_amp * volts }}
  switch_to_three: >-
    {{ can_switch_phases and phases == 1
       and available_watts >= min_amp * volts * 3 * 1.1 }}

actions:
  # Only writes when the computed current actually changes, so a noisy grid
  # sensor does not produce redundant Modbus writes.
  - choose:
      # Too little surplus for three phases but enough for one: go
      # single-phase at the current that the surplus carries.
      - conditions:
          - condition: template
            value_template: "{{ switch_to_single }}"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: "{{ phase_switch }}"
          - action: number.set_value
            target:
              entity_id: !input current_entity
            data:
              value: >-
                {{ [[(available_watts / volts) | int, min_amp] | max,
                    max_amp] | min }}

      # Enough surplus for the minimum on all three phases: go three-phase.
      - conditions:
          - condition: template
            value_template: "{{ switch_to_three }}"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: "{{ phase_switch }}"
          - action: number.set_value
            target:
              entity_id: !input current_entity
            data:
              value: >-
                {{ [[(available_watts / (volts * 3)) | int, min_amp] | max,
                    max_amp] | min }}

      - conditions:
          - condition: template
            value_template: >-
              {{ target_amps >= min_amp and target_amps <= max_amp }}
          - condition: template
            value_template: "{{ target_amps != current_setpoint }}"
        sequence:
          - action: number.set_value
            target:
              entity_id: !input current_entity
            data:
              value: "{{ target_amps }}"

      # More surplus than the maximum: charge at the maximum.
      - conditions:
          - condition: template
            value_template: >-
              {{ target_amps > max_amp and current_setpoint != max_amp }}
        sequence:
          - action: number.set_value
            target:
              entity_id: !input current_entity
            data:
              value: "{{ max_amp }}"

      # Below the minimum (1-5 A is not a valid charging current): pause, or
      # keep charging at the minimum, depending on the "below_minimum" input.
      # "Keep" only lowers a higher current; it never restarts charging that
      # is paused (0 A).
      - conditions:
          - condition: template
            value_template: >-
              {{ target_amps < min_amp and below_minimum == 'pause'
                 and current_setpoint != 0 }}
        sequence:
          - action: number.set_value
            target:
              entity_id: !input current_entity
            data:
              value: 0
      - conditions:
          - condition: template
            value_template: >-
              {{ target_amps < min_amp and below_minimum != 'pause'
                 and current_setpoint > min_amp }}
        sequence:
          - action: number.set_value
            target:
              entity_id: !input current_entity
            data:
              value: "{{ min_amp }}"
